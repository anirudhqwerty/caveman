name: Verify Codex 0.165.0 profile
on:
  push:
    branches: [verify/1417-codex-route]
jobs:
  route:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install isolated upstream binary and CLI build dependencies
        shell: pwsh
        run: |
          $taskPrefix = Join-Path $env:RUNNER_TEMP 'codex-01650'
          npm install --prefix $taskPrefix --no-audit --no-fund --no-package-lock @openai/codex@0.165.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Join-Path $taskPrefix 'node_modules\.bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix packages/cli
          exit $LASTEXITCODE
      - run: npm --prefix packages/cli run build
      - name: Prove baseline drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          node agents/probe-installed.mjs --require codex --allow-newer --json > evidence/probe-drift.json
          node -e "const assert=require('node:assert/strict'),r=require('./evidence/probe-drift.json').results.find(r=>r.id==='codex');assert.equal(r.status,'drift');assert.equal(r.tested,'0.164.0');assert.equal(r.observed,'0.165.0');assert.equal(r.version_ok,true);assert.equal(r.help_ok,true);"
          set +e
          node agents/probe-installed.mjs --require codex --json > evidence/probe-strict.json
          result=$?
          set -e
          test "$result" = 1
      - name: Real routing probes from two scratch homes
        run: node investigation/1417/route.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-codex-01650
          path: evidence/
